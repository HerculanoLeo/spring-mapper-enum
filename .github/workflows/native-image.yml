# Native image builds are slow. Run them weekly or by hand, not on every pull request.
name: Native image

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'false'

      - name: Install library artifacts
        run: mvn -B -P '!github' install -DskipTests

      - name: Compile JPA native image
        working-directory: samples/samples-native/sample-jpa
        run: mvn -B -P '!github,native' native:compile

      - name: Compile Feign native image
        working-directory: samples/samples-native/sample-feign
        run: mvn -B -P '!github,native' native:compile
