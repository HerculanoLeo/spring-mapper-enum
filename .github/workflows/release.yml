# Tag release (v*.*.*): run compatibility matrix, then deploy.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  compatibility:
    uses: ./.github/workflows/compatibility-matrix.yml

  deploy:
    needs: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configure Maven for GitHub Packages
        uses: s4u/maven-settings-action@v3.1.0
        with:
          servers: |
            [{
              "id": "github-spring-mapper-enum",
              "username": "${{ github.actor }}",
              "password": "${{ secrets.GITHUB_TOKEN }}"
            }]

      - name: Deploy
        run: mvn -B -Pgithub deploy -DskipTests
